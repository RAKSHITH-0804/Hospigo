        outline-offset: 2px;
      }

        color: #0f172a;
        -webkit-font-smoothing: antialiased;

        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

        animation: fadeIn 0.18s ease-out forwards;

      function statusBadge(label) {
        const normalized = label.toLowerCase();
        let bg = 'bg-slate-100',
          text = 'text-slate-700',
          dot = 'bg-slate-400';
        if (
          [
            'active',
            'checked in, paid',
            'dispensed',
            'report ready',
            'paid',
            'paid at desk',
            'available',
            'ready',
          ].some((k) => normalized.includes(k))
        ) {
          bg = 'bg-[#ECFDF5]';
          text = 'text-[#065F46]';
          dot = 'bg-[#10B981]';
        } else if (
          [
            'in consultation',
            'admitted',
            'processing',
            'occupied',
            'sample collected',
            'checked in',
          ].some((k) => normalized.includes(k))
        ) {
          bg = 'bg-[#F0FDFA]';
          text = 'text-[#115E59]';
          dot = 'bg-[#0D9488]';
        } else if (
          ['booked, unpaid at desk', 'pending', 'awaiting sample', 'unpaid', 'partial'].some((k) =>
            normalized.includes(k),
          )
        ) {
          bg = 'bg-[#FFFBEB]';
          text = 'text-[#92400E]';
          dot = 'bg-[#F59E0B]';
        } else if (
          ['critical', 'overdue', 'out of stock', 'low'].some((k) => normalized.includes(k))
        ) {
          bg = 'bg-[#FEF2F2]';
          text = 'text-[#991B1B]';
          dot = 'bg-[#EF4444]';
        }
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${bg} ${text} whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${label}</span>`;
      }

      function showToast(title, subtitle = '') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className =
          'pointer-events-auto bg-[#0E2929] text-white px-4 py-3 rounded-xl shadow-lg border border-[#183D3D] flex items-start gap-3 max-w-sm animate-fade';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-[#10B981] mt-1.5 shrink-0"></span><div class="text-xs"><div class="font-semibold text-white">${title}</div>${subtitle ? `<div class="text-[#8FA8A8] mt-0.5">${subtitle}</div>` : ''}</div>`;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.2s';
          setTimeout(() => el.remove(), 220);
        }, 3200);
      }

      function openDrawer({ title, subtitle = '', bodyHtml, footerHtml = '' }) {
        document.getElementById('drawerTitle').textContent = title;
        document.getElementById('drawerSubtitle').textContent = subtitle;
        document.getElementById('drawerBody').innerHTML = bodyHtml;
        document.getElementById('drawerFooter').innerHTML = footerHtml;
        document.getElementById('drawerBackdrop').classList.remove('hidden');
        document.getElementById('drawerPanel').classList.remove('translate-x-full');
      }

      function closeDrawer() {
        document.getElementById('drawerBackdrop').classList.add('hidden');
        document.getElementById('drawerPanel').classList.add('translate-x-full');
      }

      // IPD Wards View & Drawers

        const occupied = 36 + occupiedDelta;
        const available = totalBeds - occupied;
        const wards = ['All wards', 'General Ward', 'Private Rooms', 'ICU'];
        const filteredBeds =
          state.ipdWardFilter === 'All wards'
            ? state.beds
            : state.beds.filter((b) => b.ward === state.ipdWardFilter);
        const occupiedPatients = filteredBeds.filter((b) => b.status === 'Occupied');

        return `
        ${renderHospitalSidebar('ipd')}

          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">

              <h1 class="text-2xl font-semibold text-[#0F172A] tracking-tight">IPD wards</h1>

              <div class="inline-flex bg-white p-1 rounded-lg border border-[#E2E8F0]">

            </div>
          </div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Total beds</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${totalBeds}</div><div class="text-xs text-slate-400 mt-1">Across 3 wards</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Occupied</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${occupied}</div><div class="text-xs text-[#0D9488] font-medium mt-1">${Math.round((occupied / totalBeds) * 100)}% occupancy</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Available</div><div class="text-2xl font-semibold text-[#065F46] tabular-nums mt-1.5">${available}</div><div class="text-xs text-slate-400 mt-1">Ready for admission</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Discharges today</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.ipdDischargesToday}</div><div class="text-xs text-slate-400 mt-1">2 summaries pending</div></div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 mb-6">
            <div class="flex items-center justify-between mb-3.5">
              <h2 class="text-sm font-semibold text-[#0F172A]">Live ward bed map (${state.ipdWardFilter})</h2>

                <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#0D9488]"></span>Occupied</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#10B981]"></span>Available</span>
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${filteredBeds
                .map((bed) => {
                  const isOcc = bed.status === 'Occupied';
                  return `
                  <div onclick="${isOcc ? `openVitalsDrawer('${bed.id}')` : `openAdmitDrawer('${bed.id}')`}" class="cursor-pointer rounded-xl border p-3.5 transition-all ${isOcc ? 'bg-[#F7F9F9] border-[#CBD5E1] hover:border-[#0F6E66]' : 'bg-[#ECFDF5]/60 border-[#A7F3D0] hover:border-[#10B981]'}">
                    <div class="flex items-center justify-between"><span class="text-xs font-semibold text-[#0F172A] tabular-nums">${bed.id}</span><span class="text-[11px] font-medium ${isOcc ? 'text-[#115E59]' : 'text-[#065F46]'}">${bed.status}</span></div>
                    <div class="text-xs text-slate-500 mt-0.5">${bed.ward}</div>
                    <div class="mt-2.5 pt-2 border-t border-slate-200/70">
                      ${isOcc ? `<div class="text-xs font-medium text-[#0F172A] truncate">${bed.patient}</div><div class="text-[11px] text-slate-500 truncate">${bed.doctor} • ${bed.day}</div>` : `<div class="text-xs font-medium text-[#065F46]">+ Assign patient</div><div class="text-[11px] text-slate-500">Sanitized & ready</div>`}
                    </div>
                  </div>`;
                })
                .join('')}
            </div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl overflow-hidden">
            <div class="px-5 py-4 border-b border-[#E2E8F0] flex items-center justify-between"><h2 class="text-sm font-semibold text-[#0F172A]">Active in-patient admissions</h2><span class="text-xs text-slate-500">Showing ${occupiedPatients.length} admitted patients</span></div>

              <table class="w-full text-left border-collapse">
                <thead><tr class="border-b border-[#E2E8F0] bg-[#F7F9F9] text-[12px] font-medium text-slate-500"><th class="py-3 px-4">Bed / Ward</th><th class="py-3 px-4">Patient</th><th class="py-3 px-4">Admitting doctor</th><th class="py-3 px-4">Diagnosis & day</th><th class="py-3 px-4">Vitals / nursing</th><th class="py-3 px-4">Billing status</th><th class="py-3 px-4 text-right">Action</th></tr></thead>
                <tbody class="divide-y divide-[#E2E8F0] text-[13.5px]">
                  ${occupiedPatients
                    .map(
                      (b) => `
                    <tr class="hover:bg-slate-50/70 transition-colors">
                      <td class="py-3.5 px-4 whitespace-nowrap"><div class="font-semibold text-[#0F172A] tabular-nums">${b.id}</div><div class="text-xs text-slate-500">${b.ward}</div></td>
                      <td class="py-3.5 px-4 font-medium text-[#0F172A] whitespace-nowrap">${b.patient}</td>
                      <td class="py-3.5 px-4 text-slate-600 whitespace-nowrap">${b.doctor}</td>
                      <td class="py-3.5 px-4"><div class="text-[#0F172A]">${b.diagnosis}</div><div class="text-xs text-slate-500">${b.day}</div></td>
                      <td class="py-3.5 px-4 whitespace-nowrap"><div class="text-xs font-medium text-[#0F172A] tabular-nums">${b.vitals}</div><div class="text-[11px] text-slate-500">${b.nursing}</div></td>

                      <td class="py-3.5 px-4 text-right whitespace-nowrap"><div class="inline-flex items-center gap-1.5"><button onclick="openVitalsDrawer('${b.id}')" class="px-2.5 py-1.5 rounded-lg border border-[#CBD5E1] bg-white hover:bg-slate-50 text-xs font-medium text-[#0F172A]">Update vitals</button><button onclick="openDischargeDrawer('${b.id}')" class="px-2.5 py-1.5 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-xs font-semibold">Discharge</button></div></td>

                    )
                    .join('')}

              </table>
            </div>
          </div>
        </main>`;
      }

      function setIPDWardFilter(ward) {
        state.ipdWardFilter = ward;
        renderAll();
      }
      function openAdmitDrawer(preselectedBedId = '') {
        const availableBeds = state.beds.filter((b) => b.status === 'Available');
        openDrawer({
          title: 'Admit patient to IPD',
          subtitle: 'Sunrise Hospital • In-Patient Desk',
          bodyHtml: `<div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Patient name & age</label><input id="admitPatientName" type="text" value="Ramesh Hegde, 54" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm" /></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Assign available bed</label><select id="admitBedId" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm bg-white">${availableBeds.length ? availableBeds.map((b) => `<option value="${b.id}" ${b.id === preselectedBedId ? 'selected' : ''}>${b.id} — ${b.ward}</option>`).join('') : `<option value="">No vacant beds in demo list</option>`}</select></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Admitting doctor</label><select id="admitDoctor" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm bg-white"><option value="Dr. Mehta">Dr. Mehta (Cardiology)</option><option value="Dr. Rao">Dr. Rao (General Medicine)</option></select></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Provisional diagnosis</label><input id="admitDiagnosis" type="text" value="Chest pain evaluation & Holter monitoring" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm" /></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Initial deposit (₹)</label><input id="admitDeposit" type="text" value="Advance Paid (₹10,000)" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm" /></div>`,
          footerHtml: `<button onclick="closeDrawer()" class="px-4 py-2 rounded-lg border border-[#CBD5E1] bg-white text-sm font-medium text-[#0F172A]">Cancel</button><button onclick="submitAdmitPatient()" class="px-4 py-2 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold">Confirm admission</button>`,
        });
      }
      function submitAdmitPatient() {
        const bedId = document.getElementById('admitBedId')?.value;
        const patient = document.getElementById('admitPatientName')?.value.trim();
        const bed = state.beds.find((b) => b.id === bedId);
        if (bed && patient) {
          bed.status = 'Occupied';
          bed.patient = patient;
          bed.doctor = document.getElementById('admitDoctor')?.value;
          bed.diagnosis =
            document.getElementById('admitDiagnosis')?.value.trim() || 'Under observation';
          bed.day = 'Day 1';
          bed.vitals = 'BP 122/80 • SpO₂ 99%';
          bed.nursing = 'Admitted just now';
          bed.billing = document.getElementById('admitDeposit')?.value.trim() || 'Advance Paid';
          closeDrawer();
          renderAll();
          showToast(`Admitted ${patient}`, `Assigned to ${bed.id} (${bed.ward})`);
        }
      }
      function openVitalsDrawer(bedId) {
        const bed = state.beds.find((b) => b.id === bedId);
        if (!bed) return;
        openDrawer({
          title: `Update vitals • ${bed.id}`,
          subtitle: `${bed.patient} • ${bed.doctor}`,
          bodyHtml: `<div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Latest vitals reading</label><input id="vitalsInput" type="text" value="${bed.vitals}" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm" /></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Nursing station status</label><select id="nursingStatusInput" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm bg-white"><option ${bed.nursing === 'Stable' ? 'selected' : ''}>Stable</option><option ${bed.nursing === 'IV Fluids' ? 'selected' : ''}>IV Fluids</option><option ${bed.nursing === 'Post-op watch' ? 'selected' : ''}>Post-op watch</option><option ${bed.nursing === 'Critical watch' ? 'selected' : ''}>Critical watch</option><option ${bed.nursing === 'Discharge planned' ? 'selected' : ''}>Discharge planned</option></select></div>`,
          footerHtml: `<button onclick="closeDrawer()" class="px-4 py-2 rounded-lg border border-[#CBD5E1] bg-white text-sm font-medium text-[#0F172A]">Cancel</button><button onclick="saveVitals('${bed.id}')" class="px-4 py-2 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold">Save vitals</button>`,
        });
      }
      function saveVitals(bedId) {
        const bed = state.beds.find((b) => b.id === bedId);
        if (bed) {
          bed.vitals = document.getElementById('vitalsInput').value;
          bed.nursing = document.getElementById('nursingStatusInput').value;
          closeDrawer();
          renderAll();
          showToast('Nursing chart updated', `${bed.patient} (${bed.id})`);
        }
      }
      function openDischargeDrawer(bedId) {
        const bed = state.beds.find((b) => b.id === bedId);
        if (!bed) return;
        openDrawer({
          title: `Discharge summary • ${bed.id}`,
          subtitle: `${bed.patient} • ${bed.ward}`,
          bodyHtml: `<div class="p-3.5 rounded-xl bg-[#F7F9F9] border border-[#E2E8F0] text-xs space-y-1.5"><div class="flex justify-between"><span class="text-slate-500">Admitting consultant:</span><span class="font-medium">${bed.doctor}</span></div><div class="flex justify-between"><span class="text-slate-500">Diagnosis:</span><span class="font-medium">${bed.diagnosis}</span></div><div class="flex justify-between"><span class="text-slate-500">Stay duration:</span><span class="font-medium">${bed.day}</span></div><div class="flex justify-between"><span class="text-slate-500">Billing clearance:</span><span class="font-medium text-[#065F46]">${bed.billing}</span></div></div><div><label class="block text-xs font-medium text-[#0F172A] mb-1.5">Discharge advice & follow-up</label><textarea rows="3" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm">Continue prescribed oral medications. Review in Cardiology OPD after 7 days with repeat ECG.</textarea></div>`,
          footerHtml: `<button onclick="closeDrawer()" class="px-4 py-2 rounded-lg border border-[#CBD5E1] bg-white text-sm font-medium text-[#0F172A]">Close</button><button onclick="completeDischarge('${bed.id}')" class="px-4 py-2 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold">Complete discharge & free bed</button>`,
        });
      }
      function completeDischarge(bedId) {
        const bed = state.beds.find((b) => b.id === bedId);
        if (bed) {
          const name = bed.patient;
          bed.status = 'Available';
          bed.patient = null;
          state.ipdDischargesToday += 1;
          closeDrawer();
          renderAll();
          showToast(`Discharged ${name}`, `Bed ${bed.id} marked available`);
        }
      }

                    .join('')}
                </div>
                <div class="mt-6 pt-4 border-t border-[#E2E8F0] flex items-center justify-end gap-3"><button onclick="provisionNewHospital()" class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold transition-colors">Create hospital workspace</button></div>
              </section>
            </div>
            <div class="lg:col-span-5 space-y-4 lg:sticky lg:top-20">
              <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 sm:p-6">
                <div class="flex items-center justify-between mb-4"><span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Live tenant preview</span>${statusBadge('Ready to provision')}</div>
                <div class="rounded-xl bg-[#0E2929] text-white p-4 mb-4">
                  <div class="font-semibold text-base">${f.hospitalName || 'New Hospital'}</div>
                  <div class="text-xs text-[#8FA8A8] mt-0.5">Powered by Hospigo • ${f.cityState || 'India'}</div>
                  <div class="mt-3 flex flex-wrap gap-1.5">${activeModules.map((mod) => `<span class="px-2 py-0.5 rounded bg-[#183D3D] text-teal-100 text-[11px] font-medium">${mod}</span>`).join('')}</div>
                </div>
                <div class="space-y-3 text-xs">
                  <div class="p-3 rounded-lg bg-[#F7F9F9] border border-[#E2E8F0]"><div class="text-slate-500">Staff sign-in credentials</div><div class="font-semibold text-[#0F172A] mt-1">Code: <span class="font-mono text-[#0F6E66]">${f.accessCode || 'CODE'}</span></div><div class="text-slate-600 mt-0.5">${f.adminEmail || 'admin@hospital.com'}</div></div>
                  <div class="p-3 rounded-lg bg-[#F7F9F9] border border-[#E2E8F0]"><div class="text-slate-500">Public patient booking link</div><div class="font-medium text-[#0F6E66] mt-1">hospigo.in/book/${cleanSlug || 'clinic'}</div></div>
                </div>
              </div>
            </div>
          </div>
        </main>`;
      }

      function updateOnboardField(key, val) {
        state.onboardForm[key] = val;
        renderAll();
      }
      function toggleOnboardModule(modKey) {
        state.onboardForm.modules[modKey] = !state.onboardForm.modules[modKey];
        renderAll();
      }
      function provisionNewHospital() {
        const f = state.onboardForm;
        const enabled = Object.keys(f.modules).filter((k) => f.modules[k]);
        if (!f.hospitalName.trim() || !f.accessCode.trim()) return;
        state.hospitals.push({
          name: f.hospitalName.trim(),
          city: f.cityState.trim() || 'India',
          code: f.accessCode.trim().toUpperCase(),
          modules: enabled.length ? enabled : ['OPD'],
          status: 'Active',
          staffCount: 12,
        });
        navigate('hq-hospitals');
        showToast(
          `${f.hospitalName} onboarded`,
          `Access code ${f.accessCode.toUpperCase()} is now live`,
        );
      }

      // Sign In View
      function renderSignIn() {
        const isStaff = state.signInMode === 'staff';
        return `
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-[calc(100vh-49px)] bg-white animate-fade">
          <div class="lg:col-span-5 bg-[#0E2929] text-white p-8 sm:p-12 flex flex-col justify-between">
            <div>
              <div class="inline-flex items-center gap-2 text-lg font-semibold tracking-tight"><span class="w-7 h-7 rounded-lg bg-[#0F6E66] flex items-center justify-center text-sm font-bold">H</span>Hospigo</div>
              <div class="mt-12 sm:mt-20 max-w-sm"><h2 class="text-3xl sm:text-4xl font-semibold tracking-tight leading-tight">One platform.<br/>Every hospital.</h2><p class="mt-4 text-sm sm:text-base text-[#8FA8A8] leading-relaxed">OPD, IPD, pharmacy, lab and online booking, set up for your hospital.</p></div>
            </div>
            <div class="pt-8 text-xs text-[#8FA8A8]">A product by Indigo</div>
          </div>
          <div class="lg:col-span-7 flex items-center justify-center p-6 sm:p-12 bg-[#F7F9F9]">
            <div class="w-full max-w-md bg-white border border-[#E2E8F0] rounded-2xl p-6 sm:p-8 shadow-xs">
              <h1 class="text-2xl font-bold text-[#0F172A] tracking-tight">Sign in</h1>
              <div class="mt-5 grid grid-cols-2 p-1 rounded-xl bg-[#F1F5F9]">
                <button onclick="setSignInMode('staff')" class="py-2 text-sm font-semibold rounded-lg transition-all ${isStaff ? 'bg-white text-[#0F172A] shadow-xs' : 'text-slate-500 hover:text-[#0F172A]'}">Hospital staff</button>
                <button onclick="setSignInMode('hq')" class="py-2 text-sm font-semibold rounded-lg transition-all ${!isStaff ? 'bg-white text-[#0F172A] shadow-xs' : 'text-slate-500 hover:text-[#0F172A]'}">Indigo HQ</button>
              </div>
              <div class="mt-5 space-y-4">
                ${isStaff ? `<div><label class="block text-xs font-semibold text-[#0F172A] mb-1.5">Hospital access code</label><input type="text" value="${state.signInForm.accessCode}" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A]" /></div>` : ''}
                <div><label class="block text-xs font-semibold text-[#0F172A] mb-1.5">Email</label><input type="email" value="${isStaff ? state.signInForm.email : 'ops@indigohealth.in'}" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A]" /></div>
                <div><label class="block text-xs font-semibold text-[#0F172A] mb-1.5">Password</label><input type="password" value="${state.signInForm.password}" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A]" /></div>
                <button onclick="handleSignInSubmit()" class="w-full py-2.5 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold transition-colors mt-2">Sign in</button>
              </div>
              <p class="mt-4 text-xs text-slate-500 leading-relaxed">HQ team: switch to Indigo HQ, no access code needed.</p>
            </div>
          </div>
        </div>`;
      }

      function setSignInMode(mode) {
        state.signInMode = mode;
        renderAll();
      }
      function handleSignInSubmit() {
        if (state.signInMode === 'staff') {
          navigate('opd');
          showToast('Signed in to Sunrise Hospital', 'Welcome back, Dr. Mehta');
        } else {
          navigate('hq-hospitals');
          showToast('Signed in to Hospigo HQ', 'Indigo platform admin console');
        }
      }

      // Hospigo HQ Hospitals List View
      function renderHQHospitals() {
        const totalStaff = state.hospitals.reduce((acc, h) => acc + h.staffCount, 0);
        return `
        ${renderHQSidebar('hq-hospitals')}
        <main class="flex-1 p-5 sm:p-8 max-w-7xl mx-auto w-full animate-fade">
          <div class="flex items-center justify-between mb-6"><h1 class="text-2xl font-semibold text-[#0F172A] tracking-tight">Hospitals</h1><button onclick="navigate('hq-onboard')" class="px-4 py-2 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold transition-colors">Onboard hospital</button></div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Hospitals</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.hospitals.length}</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Staff accounts</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${totalStaff}</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Last backup</div><div class="text-xl font-semibold text-[#0F172A] tabular-nums mt-2">Today 02:00</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">System health</div><div class="mt-2 flex items-start gap-2 text-xs font-medium text-[#065F46]"><span class="w-2 h-2 rounded-full bg-[#10B981] mt-1 shrink-0"></span><span>Database, Redis, MinIO, WebSocket: all up</span></div></div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead><tr class="border-b border-[#E2E8F0] bg-[#F7F9F9] text-[12px] font-medium text-slate-500"><th class="py-3 px-4">Hospital</th><th class="py-3 px-4">Access code</th><th class="py-3 px-4">Modules</th><th class="py-3 px-4">Status</th></tr></thead>
                <tbody class="divide-y divide-[#E2E8F0] text-[13.5px]">
                  ${state.hospitals
                    .map(
                      (h) => `
                    <tr onclick="navigate('ipd')" class="cursor-pointer hover:bg-slate-50/80 transition-colors">
                      <td class="py-3.5 px-4 font-medium text-[#0F172A] whitespace-nowrap">${h.name}</td>
                      <td class="py-3.5 px-4 font-mono text-xs font-semibold text-slate-600 whitespace-nowrap">${h.code}</td>
                      <td class="py-3.5 px-4"><div class="flex flex-wrap gap-1.5">${h.modules.map((m) => `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-xs font-medium">${m}</span>`).join('')}</div></td>
                      <td class="py-3.5 px-4 whitespace-nowrap">${statusBadge(h.status)}</td>
                    </tr>`,
                    )
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        </main>`;
      }

      // OPD Queue View
      function renderOPDQueue() {
        return `
        ${renderHospitalSidebar('opd')}
        <main class="flex-1 p-5 sm:p-8 max-w-7xl mx-auto w-full animate-fade">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div><h1 class="text-2xl font-semibold text-[#0F172A] tracking-tight">OPD queue</h1><p class="text-sm text-slate-500 mt-0.5">Dr. Mehta, Cardiology</p></div>
            <button onclick="callNextPatient()" class="px-4 py-2 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold transition-colors self-start sm:self-auto">Call next patient</button>
          </div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Waiting</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.opdStats.waiting}</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">In consultation</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.opdStats.inConsultation}</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Seen today</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.opdStats.seenToday}</div></div>
            <div class="bg-white border border-[#E2E8F0] rounded-xl p-4 sm:p-5"><div class="text-xs font-medium text-slate-500">Online bookings</div><div class="text-2xl font-semibold text-[#0F172A] tabular-nums mt-1.5">${state.opdStats.onlineBookings}</div></div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead><tr class="border-b border-[#E2E8F0] bg-[#F7F9F9] text-[12px] font-medium text-slate-500"><th class="py-3 px-4">Token</th><th class="py-3 px-4">Patient</th><th class="py-3 px-4">Slot</th><th class="py-3 px-4">Status</th></tr></thead>
                <tbody class="divide-y divide-[#E2E8F0] text-[13.5px]">
                  ${state.opdQueue.map((row) => `<tr class="hover:bg-slate-50/70 transition-colors"><td class="py-3.5 px-4 font-semibold text-[#0F172A] tabular-nums whitespace-nowrap">${row.token}</td><td class="py-3.5 px-4 font-medium text-[#0F172A] whitespace-nowrap">${row.patient}</td><td class="py-3.5 px-4 text-slate-600 tabular-nums whitespace-nowrap">${row.slot}</td><td class="py-3.5 px-4 whitespace-nowrap">${statusBadge(row.status)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </main>`;
      }

      function callNextPatient() {
        const currentIdx = state.opdQueue.findIndex((p) => p.status === 'In consultation');
        if (currentIdx !== -1) {
          state.opdQueue[currentIdx].status = 'Seen';
          state.opdStats.seenToday += 1;
        }
        const nextIdx = state.opdQueue.findIndex((p) => p.status.includes('Checked in'));
        if (nextIdx !== -1) {
          state.opdQueue[nextIdx].status = 'In consultation';
          state.opdStats.waiting = Math.max(0, state.opdStats.waiting - 1);
          renderAll();
          showToast(
            `Called Token ${state.opdQueue[nextIdx].token}`,
            `${state.opdQueue[nextIdx].patient} moved to consultation`,
          );
        } else {
          renderAll();
          showToast('Queue updated', 'No more checked-in patients waiting');
        }
      }

      // Public Patient OPD Booking View
      function renderPublicBooking() {
        const bf = state.bookingForm;
        const doctors = [
          { name: 'Dr. Mehta', spec: 'Cardiology, fee 500' },
          { name: 'Dr. Rao', spec: 'General medicine, fee 300' },
        ];
        const slots = ['10:00', '10:15', '10:30', '10:45'];
        return `
        <div class="flex-1 flex items-center justify-center p-4 sm:p-8 bg-[#F7F9F9] animate-fade">
          <div class="w-full max-w-lg bg-white border border-[#E2E8F0] rounded-2xl p-6 sm:p-8 shadow-xs">
            <div class="text-xs font-semibold text-[#0F6E66] uppercase tracking-wider">Sunrise Hospital</div>
            <h1 class="text-2xl font-bold text-[#0F172A] tracking-tight mt-1">Book an OPD appointment</h1>
            <div class="mt-6">
              <div class="text-xs font-semibold text-[#0F172A] mb-2.5">1. Choose doctor</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${doctors.map((d) => `<button type="button" onclick="selectBookingDoctor('${d.name}')" class="text-left p-3.5 rounded-xl border transition-all ${bf.doctor === d.name ? 'border-[#0F6E66] bg-[#F0FDFA]/70' : 'border-[#E2E8F0] bg-white hover:border-[#CBD5E1]'}"><div class="text-sm font-semibold text-[#0F172A]">${d.name}</div><div class="text-xs text-slate-500 mt-0.5">${d.spec}</div></button>`).join('')}
              </div>
            </div>
            <div class="mt-6">
              <div class="text-xs font-semibold text-[#0F172A] mb-2.5">2. Choose slot, today</div>
              <div class="grid grid-cols-4 gap-2">
                ${slots.map((s) => `<button type="button" onclick="selectBookingSlot('${s}')" class="py-2 rounded-lg border text-xs font-semibold tabular-nums transition-all ${bf.slot === s ? 'border-[#0F6E66] bg-[#0F6E66] text-white' : 'border-[#CBD5E1] bg-white text-[#0F172A] hover:bg-slate-50'}">${s}</button>`).join('')}
              </div>
            </div>
            <div class="mt-6 space-y-3.5">
              <div class="text-xs font-semibold text-[#0F172A]">3. Your details</div>
              <div><label class="block text-xs font-medium text-slate-600 mb-1">Name</label><input type="text" value="${bf.name}" oninput="state.bookingForm.name = this.value" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A]" /></div>
              <div><label class="block text-xs font-medium text-slate-600 mb-1">Mobile number</label><input type="tel" value="${bf.mobile}" oninput="state.bookingForm.mobile = this.value" class="w-full px-3.5 py-2.5 rounded-lg border border-[#CBD5E1] text-sm text-[#0F172A] tabular-nums" /></div>
              ${
                bf.confirmed
                  ? `<div class="p-3.5 rounded-xl bg-[#ECFDF5] border border-[#A7F3D0] text-xs text-[#065F46] font-medium">✓ Appointment booked! Token <span class="font-bold">A-018</span> reserved for ${bf.name} with ${bf.doctor} at ${bf.slot}.</div>`
                  : `<button onclick="triggerBookingOTP()" class="w-full py-2.5 rounded-lg bg-[#0F6E66] hover:bg-[#0B5751] text-white text-sm font-semibold transition-colors mt-1">${bf.otpSent ? 'Verify OTP (4829) & confirm' : 'Send OTP'}</button>`
              }
            </div>
            <p class="mt-4 text-xs text-slate-500 leading-relaxed">No payment now. Pay the fee at the hospital desk when you arrive.</p>
          </div>
        </div>`;
      }

      function selectBookingDoctor(doc) {
        state.bookingForm.doctor = doc;
        state.bookingForm.confirmed = false;
        renderAll();
      }
      function selectBookingSlot(slot) {
        state.bookingForm.slot = slot;
        state.bookingForm.confirmed = false;
        renderAll();
      }
      function triggerBookingOTP() {
        if (!state.bookingForm.otpSent) {
          state.bookingForm.otpSent = true;
          renderAll();
          showToast('OTP sent via SMS', 'Use auto-filled demo OTP 4829 to confirm');
        } else {
          state.bookingForm.confirmed = true;
          state.opdStats.onlineBookings += 1;
          state.opdQueue.push({
            token: 'A-018',
            patient: `${state.bookingForm.name}, 32`,
            slot: state.bookingForm.slot,
            status: 'Booked, unpaid at desk',
          });
          renderAll();
          showToast('OPD slot confirmed', 'Added Token A-018 to OPD Queue & Billing desk');
        }
      }

      // Master Render Router
      function renderAll() {
        const root = document.getElementById('appRoot');
        const select = document.getElementById('workspaceSelect');
        if (select) {
          select.value = ['hq-hospitals', 'hq-onboard'].includes(state.currentView)
            ? 'hq'
            : state.currentView === 'patient-portal' || state.currentView === 'booking'
              ? 'patient'
              : 'hospital';
          select.classList.toggle(
            'hidden',
            state.currentView === 'signin' ||
              state.currentView === 'patient-portal' ||
              state.currentView === 'booking',
          );
        }
        switch (state.currentView) {
          case 'dashboard':
            root.innerHTML = renderHospitalDashboard();
            break;
          case 'patients':
          case 'doctors':
          case 'staff':
          case 'reports':
            root.innerHTML = renderDirectoryScreen(state.currentView);
            break;
          case 'ipd':
            root.innerHTML = renderIPDWards();
            break;
          case 'pharmacy':
            root.innerHTML = renderPharmacy();
            break;
          case 'lab':
            root.innerHTML = renderLabRadiology();
            break;
          case 'billing':
            root.innerHTML = renderBilling();
            break;
          case 'hq-onboard':
            root.innerHTML = renderHQOnboard();
            break;
          case 'signin':
            root.innerHTML = renderSignIn();
            break;
          case 'hq-hospitals':
            root.innerHTML = renderHQHospitals();
            break;
          case 'opd':
            root.innerHTML = renderOPDQueue();
            break;
          case 'booking':
            root.innerHTML = renderPublicBooking();
            break;
          case 'patient-portal':
            root.innerHTML = renderPatientPortal();
            break;
          default:
            root.innerHTML = renderHospitalDashboard();
        }
      }
      window.addEventListener('DOMContentLoaded', renderAll);
    </script>
  </body>
</html>
